<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="css/biblioteca.css">
</head>
<body>
    <div class="container">
        <h2>Cadastrar Livro</h2>
        <input type="text" placeholder="Titulo" id="Titulo">
        <input type="text" placeholder="Autor" id="Autor">
        <input type="text" placeholder="Ano" id="Ano">
        <input type="text" placeholder="Genero" id="Genero">

        <button id="btnCadastrar">
            Cadastrar
        </button>

        <h2>Pesquisar Livros</h2>
        <input type="Text" id="busca" placeholder="Digite o titulo">

        <h2>Estante</h2>
        <div id="estante">

        </div>
    </div>

    <script src="javascript/biblioteca.js"></script>
</body>
</html>
